<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Captain Console — 1727 Champion's League 2.0</title>

  <link rel="icon" type="image/png" href="/assets/champions-logo.png">
  <link rel="shortcut icon" href="/assets/champions-logo.png">
  <link rel="apple-touch-icon" href="/assets/champions-logo.png">

  <meta property="og:title" content="Team Captain Console — 1727 Champion's League 2.0">
  <meta property="og:description" content="Live auction bidding console for team captains.">
  <meta property="og:image" content="/assets/champions-logo.png">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/nav.css">
  <link rel="stylesheet" href="/css/auction.css">
  <link rel="stylesheet" href="/css/onblock.css">
</head>
<body data-view="CAPTAIN">


  <header class="header-banner">
    <div class="logo-container">
      <img src="/assets/champions-logo.png?v=3" alt="1727 Champion's League 2.0" class="logo-img">
    </div>
    <!-- The three organising bodies -->
    <div class="clp-partners" aria-label="Organising bodies">
      <img src="/assets/partner-csrt17.png" alt="Calcutta South Round Table 17">
      <img src="/assets/partner-csrt-cclc.png" alt="CSRT 17 and CCLC 27">
      <img src="/assets/partner-cclc27.png" alt="Calcutta Cosmopolitan Ladies Circle 27">
    </div>
    <div class="event-tagline"><i class="fa-solid fa-shield-halved"></i> Team Captain Console</div>
  </header>


  <!-- ---------- Captain Login ---------- -->
  <div class="auc-login-overlay" id="cap-login" style="display:flex;">
    <div class="auc-login-card">
      <div style="text-align:center; margin-bottom:1.5rem;">
        <img src="/assets/champions-logo.png?v=3" alt="" style="max-width:170px; height:auto;">
        <div style="font-family:var(--font-heading); font-weight:900; font-size:1.25rem; color:var(--primary-cyan); margin-top:0.75rem;">
          CAPTAIN SIGN IN
        </div>
        <div style="font-size:0.82rem; color:var(--text-muted);">
          Pick your team, then enter the password issued by the organiser
        </div>
      </div>

      <form id="cap-login-form">
        <div class="auc-field" style="margin-bottom:0.9rem;">
          <label for="cap-team">Your Team</label>
          <select id="cap-team" required>
            <option value="">— loading teams —</option>
          </select>
        </div>
        <div class="auc-field">
          <label for="cap-password">Password</label>
          <div class="password-input-wrapper" style="position:relative;">
            <input type="password" id="cap-password" placeholder="Team password"
                   autocomplete="current-password" required style="padding-right:40px;">
            <button type="button" id="cap-toggle-pw" title="Show password"
                    style="position:absolute; right:10px; top:50%; transform:translateY(-50%);
                           background:none; border:none; color:var(--text-muted); cursor:pointer;">
              <i class="fa-solid fa-eye" id="cap-eye"></i>
            </button>
          </div>
        </div>

        <div id="cap-login-err" style="display:none; color:var(--primary-red); font-size:0.85rem;
             margin-top:0.85rem; text-align:center;"></div>

        <button type="submit" class="btn-submit" id="cap-login-btn" style="margin-top:1.4rem;">
          <i class="fa-solid fa-right-to-bracket"></i> SIGN IN
        </button>
      </form>

      <div id="cap-team-roster" style="margin-top:1.3rem; padding-top:1rem;
           border-top:1px solid rgba(255,255,255,0.08); font-size:0.8rem;
           color:var(--text-muted); line-height:1.75;"></div>

    </div>
  </div>

  <!-- ---------- Captain Console ---------- -->
  <div class="auc-wrap" id="cap-main" style="display:none;">

    <!-- One line: who you are, whether the auction is live, and the way out.
         It used to be a stacked block that ate half a phone screen. -->
    <div class="cap-bar">
      <span class="cap-bar-team" id="cap-team-name">—</span>
      <span class="auc-status setup" id="cap-status">
        <span class="auc-live-dot"></span><span id="cap-status-text">—</span>
      </span>
      <button class="auc-btn auc-btn-red cap-bar-out" id="cap-logout">
        <i class="fa-solid fa-power-off"></i> <span>Sign out</span>
      </button>
    </div>

    <!-- Purse / reserve / max bid -->
    <div class="auc-stats" id="cap-stats"></div>

    <!-- Alerts aimed at this team -->
    <div id="cap-alerts"></div>

    <!-- The lot -->
    <div class="auc-card">
      <div class="auc-card-title"><i class="fa-solid fa-gavel"></i> On The Block</div>
      <div id="cap-lot"></div>
    </div>

    <!-- Squad -->
    <div class="auc-card">
      <div class="auc-card-title"><i class="fa-solid fa-list-check"></i> My Squad
        <span id="cap-squad-count" class="auc-pill available"></span>
      </div>
      <div id="cap-requirements"></div>
      <ul class="auc-squad-list" id="cap-squad"></ul>
    </div>

    <!-- Rivals -->
    <div class="auc-card">
      <div class="auc-card-title"><i class="fa-solid fa-users-rectangle"></i> Other Teams</div>
      <div class="auc-teams-grid" id="cap-rivals"></div>
    </div>

    <!-- Feed -->
    <div class="auc-card">
      <div class="auc-card-title"><i class="fa-solid fa-satellite-dish"></i> Live Feed</div>
      <div class="auc-feed" id="cap-feed"></div>
    </div>

    <!-- The whole pool, same table the public board carries (js/allplayers.js) -->
    <div id="cap-players-host"></div>
  </div>

  <footer class="clp-footer">
    <div class="clp-footer-note">1727 Champion&#39;s League 2.0 &mdash; Team Captain Console</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/links.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/auction-config.js"></script>
  <script src="/js/auction-engine.js"></script>
  <script src="/js/auction-client.js"></script>
  <script src="/js/onblock.js"></script>
  <script src="/js/allplayers.js"></script>
  <script src="/captain/captain.js"></script>
</body>
</html>
