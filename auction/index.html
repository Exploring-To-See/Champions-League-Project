<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Auction — 1727 Champion's League 2.0</title>

  <link rel="icon" type="image/png" href="/assets/champions-logo.png">
  <link rel="shortcut icon" href="/assets/champions-logo.png">
  <link rel="apple-touch-icon" href="/assets/champions-logo.png">

  <meta property="og:title" content="Live Auction — 1727 Champion's League 2.0">
  <meta property="og:description" content="Follow the 1727 Champion's League 2.0 player auction live.">
  <meta property="og:image" content="/assets/champions-logo.png">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auction.css">
</head>
<body>

  <div class="mobile-mascot-bg" aria-hidden="true">
    <img src="/assets/pug-tiger-mascot.png" alt="">
  </div>

  <header class="header-banner" style="padding-bottom:0.5rem;">
    <div class="logo-container">
      <img src="/assets/champions-logo.png?v=3" alt="1727 Champion's League 2.0" class="logo-img">
    </div>
  </header>

  <div class="auc-hero">
    <h1>Live Player Auction</h1>
    <div style="margin-top:0.5rem;">
      <span class="auc-status setup" id="pub-status">
        <span class="auc-live-dot"></span><span id="pub-status-text">CONNECTING…</span>
      </span>
    </div>
  </div>

  <div class="auc-wrap">

    <!-- Headline numbers -->
    <div class="auc-stats" id="pub-stats"></div>

    <!-- The lot on the block -->
    <div class="auc-card" id="pub-lot-card">
      <div class="auc-card-title"><i class="fa-solid fa-gavel"></i> On The Block</div>
      <div id="pub-lot"></div>
    </div>

    <!-- Team purses -->
    <div class="auc-card">
      <div class="auc-card-title"><i class="fa-solid fa-sack-dollar"></i> Team Purses</div>
      <div class="auc-teams-grid" id="pub-teams"></div>
    </div>

    <!-- Live feed -->
    <div class="auc-card">
      <div class="auc-card-title"><i class="fa-solid fa-satellite-dish"></i> Live Feed</div>
      <div class="auc-feed" id="pub-feed"></div>
    </div>

    <!-- Squads so far -->
    <div class="auc-card">
      <div class="auc-card-title"><i class="fa-solid fa-list-check"></i> Squads So Far</div>
      <div class="auc-squads" id="pub-squads"></div>
    </div>

    <!-- Remaining pool -->
    <div class="auc-card">
      <div class="auc-card-title"><i class="fa-solid fa-layer-group"></i> Pool Remaining</div>
      <div class="auc-table-box">
        <table class="auc-table">
          <thead><tr><th>Category</th><th>Base Price</th><th>Sold</th><th>Left</th><th>Progress</th></tr></thead>
          <tbody id="pub-pool"></tbody>
        </table>
      </div>
    </div>

    <div style="text-align:center; margin-top:1.5rem;">
      <a href="/captain" style="color:var(--text-muted); font-size:0.85rem; text-decoration:none;">
        <i class="fa-solid fa-shield-halved"></i> Team captain? Sign in to bid
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/auction-config.js"></script>
  <script src="/js/auction-engine.js"></script>
  <script src="/js/auction-client.js"></script>
  <script src="/auction/auction.js"></script>
</body>
</html>
