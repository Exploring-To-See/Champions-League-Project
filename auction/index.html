<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Auction — 1727 Champion's League 2.0</title>

  <link rel="icon" type="image/png" href="/assets/champions-logo.png">
  <link rel="shortcut icon" href="/assets/champions-logo.png">
  <link rel="apple-touch-icon" href="/assets/champions-logo.png">

  <meta property="og:title" content="Live Auction — 1727 Champion's League 2.0">
  <meta property="og:description" content="Follow the 1727 Champion's League 2.0 player auction live.">
  <meta property="og:image" content="/assets/champions-logo.png">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/nav.css">
  <link rel="stylesheet" href="/css/auction.css">
  <link rel="stylesheet" href="/css/onblock.css">
  <link rel="stylesheet" href="/css/soldflash.css">
</head>
<body data-view="PUBLIC">


  <header class="header-banner" style="padding-bottom:0.5rem;">
    <div class="logo-container">
      <img src="/assets/champions-logo.png?v=3" alt="1727 Champion's League 2.0" class="logo-img">
    </div>
    <!-- The three organising bodies -->
    <div class="clp-partners" aria-label="Organising bodies">
      <img src="/assets/partner-csrt17.png" alt="Calcutta South Round Table 17">
      <img src="/assets/partner-csrt-cclc.png" alt="CSRT 17 and CCLC 27">
      <img src="/assets/partner-cclc27.png" alt="Calcutta Cosmopolitan Ladies Circle 27">
    </div>
  </header>


  <div class="auc-hero">
    <h1>Live Player Auction</h1>
    <div style="margin-top:0.5rem;">
      <span class="auc-status setup" id="pub-status">
        <span class="auc-live-dot"></span><span id="pub-status-text">CONNECTING…</span>
      </span>
    </div>
  </div>

  <div class="auc-wrap">

    <!-- The lot on the block -->
    <div class="auc-card" id="pub-lot-card">
      <div id="pub-lot"></div>
    </div>

    <!-- One board: captains, wallets and squads, four teams as columns -->
    <div class="auc-card">
      <div class="auc-card-title">
        <i class="fa-solid fa-shield-halved"></i> Teams
        <span class="auc-muted" style="font-weight:500; letter-spacing:0; text-transform:none;">
          &mdash; captains, wallets and squads
        </span>
      </div>
      <!-- desktop: four columns side by side -->
      <div class="auc-table-box auc-teamboard-wrap">
        <table class="auc-table auc-teamboard" id="pub-teamboard"></table>
      </div>
      <!-- mobile: one team at a time, no sideways swiping -->
      <div class="auc-teamtabs">
        <div class="auc-teamtabs-bar" id="pub-teamtabs"></div>
        <div id="pub-teampanel"></div>
      </div>
      <div class="auc-muted" style="margin-top:0.9rem;">
        Captains sign in on their own site with the password issued by the organiser.
      </div>
    </div>

    <!-- Live feed -->
    <div class="auc-card">
      <div class="auc-card-title"><i class="fa-solid fa-satellite-dish"></i> Live Feed</div>
      <div class="auc-feed" id="pub-feed"></div>
    </div>

    <!-- Every player in the auction, and who bought them (js/allplayers.js) -->
    <div id="pub-players-host"></div>

    <!-- Remaining pool -->
    <div class="auc-card">
      <div class="auc-card-title"><i class="fa-solid fa-layer-group"></i> Pool Remaining</div>
      <div class="auc-table-box">
        <table class="auc-table">
          <thead><tr><th>Category</th><th>Base Price</th><th>Sold</th><th>In Pool</th><th>Unsold</th><th>Progress</th></tr></thead>
          <tbody id="pub-pool"></tbody>
        </table>
      </div>
    </div>

  </div>

  <footer class="clp-footer">
    <div class="clp-footer-note">1727 Champion&#39;s League 2.0 &mdash; Live Auction</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/links.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/auction-config.js"></script>
  <script src="/js/auction-engine.js"></script>
  <script src="/js/auction-client.js"></script>
  <script src="/js/onblock.js"></script>
  <script src="/js/soldflash.js"></script>
  <script src="/js/allplayers.js"></script>
  <script src="/auction/auction.js"></script>
</body>
</html>
