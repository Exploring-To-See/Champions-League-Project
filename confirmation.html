<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Confirmed — 1727 Champion's League 2.0</title>

  <!-- Favicon & Official Web App Icons -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- OpenGraph Social Link Preview Meta Tags -->
  <meta property="og:title" content="Registration Confirmed — 1727 Champion's League 2.0">
  <meta property="og:description" content="You have registered for the 1727 Champion's League 2.0.">
  <meta property="og:image" content="https://1727championsleague.vercel.app/assets/champions-logo.png">
  <meta property="og:url" content="https://1727championsleague.vercel.app/confirmation.html">
  <meta property="og:type" content="website">

  <!-- Google Fonts: Orbitron & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Main Stylesheet (shared with registration page) -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    .confirmation-wrapper {
      max-width: 620px;
      margin: 1.5rem auto 3rem;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .confirmation-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 2px solid transparent;
      border-image: linear-gradient(135deg, rgba(0, 229, 255, 0.6) 0%, rgba(255, 59, 92, 0.6) 100%) 1;
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.8),
        inset 0 0 30px rgba(0, 229, 255, 0.05),
        0 0 30px rgba(0, 229, 255, 0.2);
      width: 100%;
    }

    .confirmation-message {
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: clamp(1.4rem, 4.5vw, 2.1rem);
      letter-spacing: 1px;
      line-height: 1.35;
      background: linear-gradient(90deg, var(--primary-cyan), #ffffff, var(--primary-red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0.5rem 0 1rem;
    }

    .confirmation-mascot {
      width: 100%;
      max-width: 220px;
      height: auto;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.7));
      animation: floatMascot 4s ease-in-out infinite;
      margin: 0.5rem auto 1.5rem;
    }

    .confirmation-back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.75rem;
    }
  </style>
</head>
<body>

  <!-- Full-Page Magnified Blurred Mascot Background for Mobile View -->
  <div class="mobile-mascot-bg" aria-hidden="true">
    <img src="assets/pug-tiger-mascot.png" alt="Background Mascot Watermark">
  </div>

  <!-- Top Header Banner with Official Logo -->
  <header class="header-banner">
    <div class="logo-container">
      <img src="assets/champions-logo.png?v=3" alt="1727 Champion's League 2.0 Logo" class="logo-img">
    </div>
    <div class="event-tagline"><i class="fa-solid fa-trophy"></i> Official Player Registration — 1727 Champion's League 2.0</div>
  </header>

  <main class="confirmation-wrapper">
    <div class="confirmation-card">
      <div class="success-icon-box">
        <i class="fa-solid fa-circle-check"></i>
      </div>

      <h1 class="confirmation-message">You have registered for 1727 Champions League 2.0</h1>

      <p style="color:var(--text-muted); font-size:0.95rem;">
        Congratulations, <span id="confirmed-player-name" style="color:#fff; font-weight:700;">Player</span>! Your profile has been successfully submitted.
      </p>

      <div id="confirmed-reg-code-box" style="display:none; background:rgba(0,229,255,0.08); border:1px solid rgba(0,229,255,0.25); border-radius:12px; padding:1.25rem; margin:1.5rem 0;">
        <div style="font-size:0.85rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px;">Registration Code</div>
        <div id="confirmed-reg-code" style="font-family:var(--font-heading); font-size:1.4rem; color:var(--primary-cyan); font-weight:800; margin-top:0.25rem;">—</div>
      </div>

      <img src="assets/pug-tiger-mascot.png" alt="1727 Champion's League 2.0 Mascot" class="confirmation-mascot">

      <a href="index.html" class="btn-submit confirmation-back-link">
        <i class="fa-solid fa-house"></i> BACK TO HOME
      </a>
    </div>
  </main>

  <!-- Organiser Admin Footer Link -->
  <footer style="text-align: center; margin: 2rem 0 3rem;">
    <a href="https://championsadmin.vercel.app" target="_blank" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">
      <i class="fa-solid fa-lock"></i> Organiser Admin Console
    </a>
  </footer>

  <script>
    // Populate confirmed player name & registration code from URL query params
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name');
    const code = params.get('code');

    if (name) {
      document.getElementById('confirmed-player-name').textContent = name;
    }
    if (code) {
      document.getElementById('confirmed-reg-code').textContent = code;
      document.getElementById('confirmed-reg-code-box').style.display = 'block';
    }
  </script>
</body>
</html>
